[package]
name = "mitm-ag-tauri"
version = "2.0.2"
description = "MITM AG native desktop shell"
authors = ["MITM Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri                = { version = "=2.10.1", features = [] }
tauri-plugin-updater = { version = "2" }
serde_json           = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
