name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 – macOS  (arm64 + x64 pkg  +  Tauri .dmg cho cả hai arch)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust (stable + x86_64 target for cross-build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Cache pkg base binaries để không download lại giữa các run
      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-macos-node20-${{ runner.arch }}-v1

      - run: npm ci

      # Build cả hai macOS binaries trước – prepare-tauri.js sẽ copy đúng cái vào resources
      - name: Build pkg – macOS (arm64 + x64)
        run: npm run build:pkg:macos
        env:
          PKG_CACHE_PATH: ~/.pkg-cache

      # Xác minh binary tồn tại trước khi Tauri build
      - name: Verify pkg binaries
        run: |
          echo "=== dist/ contents ===" && ls -lh dist/
          test -f dist/mitm-antigravity-macos-arm64 || (echo "ERROR: arm64 missing" && exit 1)
          test -f dist/mitm-antigravity-macos-x64   || (echo "ERROR: x64 missing"   && exit 1)

      # ── Tauri .app / .dmg – arm64 ─────────────────────────────────────────
      - name: Tauri build – macOS arm64
        run: npx tauri build --target aarch64-apple-darwin
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin
          PKG_CACHE_PATH: ~/.pkg-cache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Tauri .app / .dmg – x64 ───────────────────────────────────────────
      - name: Tauri build – macOS x64
        run: npx tauri build --target x86_64-apple-darwin
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin
          PKG_CACHE_PATH: ~/.pkg-cache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: |
            dist/mitm-antigravity-macos-arm64
            dist/mitm-antigravity-macos-x64

      - uses: actions/upload-artifact@v4
        with:
          name: macos-tauri-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-tauri-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 – Windows  (x64 + arm64 pkg  +  Tauri NSIS installer x64)
# ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pkg-cache
          key: pkg-windows-node20-x64-v1

      - run: npm ci

      - name: Build pkg – Windows (x64 + arm64)
        run: npm run build:pkg:windows
        env:
          PKG_CACHE_PATH: ~\AppData\Local\pkg-cache

      - name: Verify pkg binaries
        shell: bash
        run: |
          echo "=== dist/ ===" && ls -lh dist/
          test -f dist/mitm-antigravity-win-x64.exe || (echo "ERROR: win-x64 missing" && exit 1)

      - name: Tauri build – Windows x64
        run: npx tauri build
        env:
          PKG_CACHE_PATH: ~\AppData\Local\pkg-cache
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-pkg
          path: |
            dist/mitm-antigravity-win-x64.exe
            dist/mitm-antigravity-win-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-tauri
          path: src-tauri/target/release/bundle/

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3a – Linux x64  (native runner)
# ─────────────────────────────────────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-linux-x64-node20-v1

      - run: npm ci

      - name: Build pkg – Linux x64
        run: npx pkg . --targets node20-linux-x64 --out-path dist
        env:
          PKG_CACHE_PATH: ~/.pkg-cache

      - name: Verify
        run: test -f dist/mitm-antigravity-linux-x64 || (ls dist/ && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-pkg
          path: dist/mitm-antigravity-linux-x64

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3b – Linux arm64  (native arm64 runner)
# ─────────────────────────────────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache pkg base binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-linux-arm64-node20-v1

      - run: npm ci

      - name: Build pkg – Linux arm64
        run: npx pkg . --targets node20-linux-arm64 --out-path dist
        env:
          PKG_CACHE_PATH: ~/.pkg-cache

      - name: Verify
        run: test -f dist/mitm-antigravity-linux-arm64 || (ls dist/ && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-pkg
          path: dist/mitm-antigravity-linux-arm64

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 – Tạo GitHub Release
# ─────────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release-artifacts/macos-pkg/mitm-antigravity-macos-arm64
            release-artifacts/macos-pkg/mitm-antigravity-macos-x64
            release-artifacts/windows-pkg/mitm-antigravity-win-x64.exe
            release-artifacts/windows-pkg/mitm-antigravity-win-arm64.exe
            release-artifacts/linux-x64-pkg/mitm-antigravity-linux-x64
            release-artifacts/linux-arm64-pkg/mitm-antigravity-linux-arm64
            release-artifacts/macos-tauri-arm64/**/*.dmg
            release-artifacts/macos-tauri-arm64/**/*.app.tar.gz
            release-artifacts/macos-tauri-x64/**/*.dmg
            release-artifacts/macos-tauri-x64/**/*.app.tar.gz
            release-artifacts/windows-tauri/**/*.exe
            release-artifacts/windows-tauri/**/*.msi
            release-artifacts/windows-tauri/**/*.nsis.zip
