<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MITM Antigravity</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #e5f0ff;
      background: radial-gradient(circle at top left, #7c6ff733, transparent 34%), #07111f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(520px, calc(100vw - 48px));
      padding: 28px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 28px 90px rgba(0,0,0,.35);
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,.18);
      border-top-color: #38bdf8;
      border-radius: 999px;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Starting MITM Antigravity…</h1>
    <p>The native window will load the local control panel automatically.</p>
  </div>
</body>
</html>
